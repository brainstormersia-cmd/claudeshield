name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_CURRENT_VERSION: v3.1.0
          NEXT_PUBLIC_GITHUB_REPOSITORY_URL: https://github.com/brainstormersia-cmd/agentrouter-autoretry-claudecode
          NEXT_PUBLIC_DOWNLOAD_URL: https://raw.githubusercontent.com/brainstormersia-cmd/agentrouter-autoretry-claudecode/main/retry-proxy.py
          NEXT_PUBLIC_SUPPORT_URL: https://github.com/brainstormersia-cmd/agentrouter-autoretry-claudecode/issues
          NEXT_PUBLIC_AGENTROUTER_URL: https://agentrouter.org

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
